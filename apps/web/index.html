<html lang="el">
  <head>
    <meta charset="UTF-8" /><!-- build -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E65100" />

    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!-- Γραμματοσειρές από το δικό μας site (GDPR: καμία κλήση στη Google). Ίδιες γραμματοσειρές με πριν

    <link rel="preload" as="font" type="font/woff2" href="/fonts/plus-jakarta-sans-latin-wght-normal.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/bricolage-grotesque-latin-opsz-normal.woff2" crossorigin />
    <style>
      @font-face { font-family: 'Bricolage Grotesque'; font-style: normal; font-display: swap; font-weight: 200 800; src: url(/fonts/bricolage-grotesque-latin-ext-opsz-normal.woff2) format('woff2'); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }

      @font-face { font-family: 'Plus Jakarta Sans'; font-style: normal; font-display: swap; font-weight: 200 800; src: url(/fonts/plus-jakarta-sans-latin-wght-normal.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }

    <meta name="description" content="GlobiPet — Η #1 πλατφόρμα για κατοικίδια. Υπηρεσίες, κατάστημα, τηλεϊατρική, GPS tracker και κοινότητα." />
    <meta name="keywords" content="κατοικίδια, pet, grooming, κτηνίατρος, pet sitting, pet taxi, GPS tracker" />
    <!-- Open Graph -->
    <meta property="og:title" content="GlobiPet — Best care for the best human's friends" />
    <meta property="og:description" content="Βρείτε υπηρεσίες, προϊόντα και κοινότητα για τα κατοικίδιά σας." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:url" content="https://globipet.com" />
    <meta property="og:type" content="website" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GlobiPet" />
    <meta name="twitter:description" content="Η #1 πλατφόρμα για κατοικίδια" />
    <meta name="twitter:image" content="/logo.png" />
    <!-- Canonical -->
    <link rel="canonical" href="https://globipet.com" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Εγκατάσταση στην αρχική οθόνη.
         Στο iOS αυτό ΔΕΝ είναι προαιρετικό: χωρίς manifest και χωρίς
         display: standalone, το Safari δεν επιτρέπει καθόλου ειδοποιήσεις
         push. Σε Android και desktop ενεργοποιεί την εγκατάσταση ως
         εφαρμογή. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Παλαιότερες εκδόσεις iOS αγνοούν το παραπάνω και θέλουν το δικό τους. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GlobiPet" />
    <title>GlobiPet — Best care for the best human's friends</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
