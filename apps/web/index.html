<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="UTF-8" /><!-- build -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E65100" />

    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!-- Γραμματοσειρές από το δικό μας site (GDPR: καμία κλήση στη Google). Ίδιες γραμματοσειρές με πριν
         (Bricolage Grotesque, Plus Jakarta Sans — SIL Open Font License, βλ. /fonts/LICENSE-*). -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/plus-jakarta-sans-latin-wght-normal.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/bricolage-grotesque-latin-opsz-normal.woff2" crossorigin />
    <style>
      @font-face { font-family: 'Bricolage Grotesque'; font-style: normal; font-display: swap; font-weight: 200 800; src: url(/fonts/bricolage-grotesque-latin-ext-opsz-normal.woff2) format('woff2'); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
      @font-face { font-family: 'Bricolage Grotesque'; font-style: normal; font-display: swap; font-weight: 200 800; src: url(/fonts/bricolage-grotesque-latin-opsz-normal.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: 'Plus Jakarta Sans'; font-style: normal; font-display: swap; font-weight: 200 800; src: url(/fonts/plus-jakarta-sans-latin-ext-wght-normal.woff2) format('woff2'); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
      @font-face { font-family: 'Plus Jakarta Sans'; font-style: normal; font-display: swap; font-weight: 200 800; src: url(/fonts/plus-jakarta-sans-latin-wght-normal.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
    </style>

    <meta name="author" content="GlobiPet" />
    <!--seo:start-->
    <!-- SEO και προεπισκοπήσεις (LinkedIn, Facebook, WhatsApp, Viber).
         Οι εικόνες και τα URL ΠΡΕΠΕΙ να είναι απόλυτα: τα crawlers των social
         δεν λύνουν σχετικές διαδρομές όπως /logo.png. Το scripts/prerender.mjs
         αντικαθιστά αυτό το μπλοκ σε κάθε δημόσια σελίδα μετά το build, με
         στοιχεία από το src/seo/pages.json. -->
    <meta name="description" content="Βρες κτηνίατρο, groomer, pet sitter, dog walker, εκπαιδευτή, φιλοξενία και pet taxi κοντά σου, κλείσε και πλήρωσε online. Κατάστημα, τηλεϊατρική και κοινότητα σε μία εφαρμογή." />
    <link rel="canonical" href="https://globipet.com/" />
    <meta property="og:site_name" content="GlobiPet" />
    <meta property="og:locale" content="el_GR" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GlobiPet — Υπηρεσίες, κατάστημα και κοινότητα για κατοικίδια" />
    <meta property="og:description" content="Βρες κτηνίατρο, groomer, pet sitter, dog walker, εκπαιδευτή, φιλοξενία και pet taxi κοντά σου, κλείσε και πλήρωσε online. Κατάστημα, τηλεϊατρική και κοινότητα σε μία εφαρμογή." />
    <meta property="og:url" content="https://globipet.com/" />
    <meta property="og:image" content="https://globipet.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GlobiPet — Ό,τι χρειάζεται το κατοικίδιό σου, σε μία εφαρμογή" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GlobiPet — Υπηρεσίες, κατάστημα και κοινότητα για κατοικίδια" />
    <meta name="twitter:description" content="Βρες κτηνίατρο, groomer, pet sitter, dog walker, εκπαιδευτή, φιλοξενία και pet taxi κοντά σου, κλείσε και πλήρωσε online." />
    <meta name="twitter:image" content="https://globipet.com/og-image.jpg" />
    <title>GlobiPet — Υπηρεσίες, κατάστημα και κοινότητα για κατοικίδια</title>
    <!--seo:end-->
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Εγκατάσταση στην αρχική οθόνη.
         Στο iOS αυτό ΔΕΝ είναι προαιρετικό: χωρίς manifest και χωρίς
         display: standalone, το Safari δεν επιτρέπει καθόλου ειδοποιήσεις
         push. Σε Android και desktop ενεργοποιεί την εγκατάσταση ως
         εφαρμογή. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Παλαιότερες εκδόσεις iOS αγνοούν το παραπάνω και θέλουν το δικό τους. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GlobiPet" />
  </head>
  <body>
    <div id="root"><!--seo:body--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
